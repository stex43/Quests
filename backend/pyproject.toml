# This file exists solely to configure ruff. The backend is deployed as a Docker image
# and is never built or installed as a wheel, so there is no build-system or project
# metadata here. Runtime dependencies live in requirements.txt.

[tool.ruff]
lint.select = ["E", "W", "F", "I", "UP"]
preview = true
line-length = 120
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
