server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx does NOT inherit add_header from an outer block into a location that sets
    # any add_header of its own, so every location below repeats the full set. Keep them
    # in sync: dropping one line silently strips that header from those responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # The entry point must never be cached: it names the content-hashed asset files, and a
    # stale copy points at files a later deploy has already deleted (blank page on the LAN).
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Vite content-hashes everything under /assets/, so a given URL's bytes never change.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        expires 1y;
        # No `always` here on purpose: that limits it to the success codes `expires` also
        # covers, so a 404 for a deleted hash is not itself marked cacheable forever.
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
