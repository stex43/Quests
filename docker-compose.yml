services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command:  >
      sh -c "
      alembic upgrade head &&
      uvicorn src.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}
      "
    environment:
        APP_ENV: docker
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    env_file:
      - ./backend/.env.docker
    # python:3.12-slim ships neither curl nor wget, so probe with Python itself. GET /arcs
    # is a safe method (the Origin check does not apply) on a LAN host the guard allows,
    # and it answers 200 with an empty list on a fresh database. start_period covers
    # `alembic upgrade head` against a cold volume.
    healthcheck:
      # 127.0.0.1 for the same reason as the frontend probe below, and because it keeps
      # the check independent of ALLOWED_HOST_REGEX keeping `localhost` in its allowlist.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:-8000}/arcs').status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_BACKEND_PORT: "${BACKEND_PORT:-8000}"
    restart: unless-stopped
    ports:
      - "5173:5173"
    # nginx:alpine has busybox wget. The dev override swaps the image for the node:22-alpine
    # Vite server on the same port, which also has busybox wget and also answers 200 on /,
    # so this one check is valid for both stacks. Probe 127.0.0.1, not localhost: the
    # container resolves localhost to ::1 first and neither server binds IPv6.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - backend

volumes:
  postgres-data:
