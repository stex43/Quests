name: Lint & Typecheck
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Linting needs ruff and nothing else; installing requirements-dev.txt would drag in
      # the whole runtime tree. Keep this pin in step with backend/requirements-dev.txt.
      - run: pip install ruff==0.15.8
      - run: ruff check src/
        working-directory: backend
      - run: ruff format --check src/
        working-directory: backend
